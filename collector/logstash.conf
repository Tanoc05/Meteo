# ============================================================================
# FASE 1B: LOGSTASH PIPELINE (Collector stdout -> Logstash pipe -> Apache Kafka)
# ============================================================================

input {
  # Avvia collector.js come sottoprocesso e legge ogni riga JSON stampata su stdout
  # Nota: 'pipe' divide già le righe a ogni '\n', quindi si usa codec => json
  pipe {
    command => "node /app/collector.js"
    codec => json
  }
}

filter {
  # Rimuove i metadati tecnici aggiunti automaticamente da Logstash per lasciare
  # il JSON pulito e identico a quello atteso da Spark Structured Streaming
  mutate {
    remove_field => ["@version", "host", "process", "event"]
  }
}

output {
  # Pubblica ogni evento sul topic di Apache Kafka usando 'city' come chiave
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS:kafka:9092}"
    topic_id => "${KAFKA_TOPIC_TELEMETRY:weather_pollution.telemetry}"
    message_key => "%{city}"
    codec => json
  }

  # Log leggibile nella console Docker per monitoraggio in tempo reale
  stdout {
    codec => line {
      format => "✅ [Logstash -> Kafka] %{city} -> Temp: %{temperature_c}°C | PM2.5: %{pm2_5} | AQI: %{european_aqi}"
    }
  }
}
